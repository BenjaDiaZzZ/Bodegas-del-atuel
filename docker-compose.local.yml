version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: bodegas_api_local
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - DB_USER=app_rw
    restart: unless-stopped

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: bodegas_front_local
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
