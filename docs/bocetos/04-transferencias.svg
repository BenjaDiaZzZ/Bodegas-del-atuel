  <text x="32" y="112" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="26" font-weight="bold">Transferencias</text>
  <text x="32" y="140" fill="#666666" font-family="Arial, sans-serif" font-size="16">Movimientos de stock entre salas. El stock se descuenta al procesar.</text>
  <rect x="1030" y="104" width="138" height="38" rx="6" fill="#5b1f2a"/>
  <text x="1052" y="129" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">+ Nueva transferencia</text>

