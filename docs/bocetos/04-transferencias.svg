  <text x="836" y="404" fill="#555555" font-family="Arial, sans-serif" font-size="14">Botella 750 ml</text>
  <text x="1022" y="404" fill="#555555" font-family="Arial, sans-serif" font-size="14">12</text>

  <line x1="550" y1="430" x2="1144" y2="430" stroke="#ebe5db"/>
  <text x="566" y="456" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="14">Chardonnay Clásico 2023</text>
  <text x="836" y="456" fill="#555555" font-family="Arial, sans-serif" font-size="14">Botella 750 ml</text>
  <text x="1022" y="456" fill="#555555" font-family="Arial, sans-serif" font-size="14">6</text>

  <line x1="550" y1="482" x2="1144" y2="482" stroke="#ebe5db"/>
  <text x="566" y="508" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="14">Rosé de Malbec 2022</text>
  <text x="836" y="508" fill="#555555" font-family="Arial, sans-serif" font-size="14">Magnum 1,5 L</text>
  <text x="1022" y="508" fill="#555555" font-family="Arial, sans-serif" font-size="14">6</text>

  <text x="550" y="556" fill="#777777" font-family="Arial, sans-serif" font-size="13">Verificar stock antes de procesar. El procesamiento descuenta del origen y suma al destino.</text>

  <rect x="550" y="590" width="130" height="38" rx="6" fill="#e9e3d8" stroke="#c9bfae"/>
  <text x="574" y="614" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Agregar renglón</text>
  <rect x="694" y="590" width="120" height="38" rx="6" fill="#5b1f2a"/>
  <text x="726" y="614" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Terminar</text>
  <rect x="828" y="590" width="140" height="38" rx="6" fill="#2f6b3a"/>
  <text x="858" y="614" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Procesar</text>
  <rect x="982" y="590" width="120" height="38" rx="6" fill="#ffffff" stroke="#a33a2b"/>
  <text x="1014" y="614" fill="#a33a2b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Anular</text>

  <text x="32" y="750" fill="#8a8175" font-family="Arial, sans-serif" font-size="13">Boceto 4 · Transferencias · TPI Bodegas del Atuel</text>
