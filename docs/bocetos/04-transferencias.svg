  <text x="430" y="542" fill="#555555" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Terminada</text>

  <rect x="52" y="574" width="430" height="72" rx="8" fill="#ffffff" stroke="#e2dbd0" stroke-dasharray="6 4"/>
