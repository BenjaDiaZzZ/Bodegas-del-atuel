  <text x="1040" y="300" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="15">Iván M.</text>

  <rect x="550" y="326" width="594" height="40" rx="6" fill="#ede6da"/>
  <text x="566" y="351" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">VINO</text>
  <text x="836" y="351" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">PRESENTACIÓN</text>
  <text x="1022" y="351" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">CANTIDAD</text>

