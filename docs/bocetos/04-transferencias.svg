  <text x="68" y="334" fill="#777777" font-family="Arial, sans-serif" font-size="12">3 renglones · 24/10/2026</text>
  <text x="430" y="334" fill="#b36b00" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Pendiente</text>

