<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Boceto de alta y edición de vino</title>
  <desc id="descripcion">Formulario con datos del vino, cepas, presentaciones y stock inicial.</desc>
  <rect width="1200" height="800" fill="#f4f1ea"/>
  <rect x="0" y="0" width="1200" height="72" fill="#5b1f2a"/>
  <text x="32" y="45" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Bodegas del Atuel</text>
  <text x="940" y="43" fill="#f2d7a6" font-family="Arial, sans-serif" font-size="17">Catálogo · Ventas · Reportes</text>

  <text x="32" y="112" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="26" font-weight="bold">Alta de vino</text>
  <text x="32" y="140" fill="#666666" font-family="Arial, sans-serif" font-size="16">Completá los datos obligatorios. Los campos con * son requeridos.</text>

  <rect x="32" y="168" width="720" height="520" rx="10" fill="#ffffff" stroke="#d8d0c2"/>
  <text x="56" y="202" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">DATOS DEL VINO</text>

  <text x="56" y="238" fill="#444444" font-family="Arial, sans-serif" font-size="14">Nombre comercial *</text>
  <rect x="56" y="248" width="320" height="36" rx="6" fill="#f8f6f1" stroke="#c9bfae"/>
  <text x="68" y="271" fill="#9a9184" font-family="Arial, sans-serif" font-size="14">Ej.: Malbec Reserva</text>

  <text x="400" y="238" fill="#444444" font-family="Arial, sans-serif" font-size="14">Bodega *</text>
  <rect x="400" y="248" width="324" height="36" rx="6" fill="#f8f6f1" stroke="#c9bfae"/>
  <text x="412" y="271" fill="#9a9184" font-family="Arial, sans-serif" font-size="14">Seleccionar bodega</text>

  <text x="56" y="314" fill="#444444" font-family="Arial, sans-serif" font-size="14">Tipo de vino *</text>
  <rect x="56" y="324" width="200" height="36" rx="6" fill="#f8f6f1" stroke="#c9bfae"/>
  <text x="68" y="347" fill="#9a9184" font-family="Arial, sans-serif" font-size="14">Tinto / Blanco / Rosado</text>

  <text x="280" y="314" fill="#444444" font-family="Arial, sans-serif" font-size="14">Añada *</text>
  <rect x="280" y="324" width="130" height="36" rx="6" fill="#f8f6f1" stroke="#c9bfae"/>
  <text x="292" y="347" fill="#9a9184" font-family="Arial, sans-serif" font-size="14">2021</text>

  <text x="434" y="314" fill="#444444" font-family="Arial, sans-serif" font-size="14">Precio de venta *</text>
  <rect x="434" y="324" width="140" height="36" rx="6" fill="#f8f6f1" stroke="#c9bfae"/>
  <text x="446" y="347" fill="#9a9184" font-family="Arial, sans-serif" font-size="14">$ 0,00</text>

  <text x="598" y="314" fill="#444444" font-family="Arial, sans-serif" font-size="14">Stock inicial</text>
  <rect x="598" y="324" width="126" height="36" rx="6" fill="#f8f6f1" stroke="#c9bfae"/>
  <text x="610" y="347" fill="#9a9184" font-family="Arial, sans-serif" font-size="14">0</text>

  <text x="56" y="402" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">CEPAS *</text>
  <rect x="56" y="414" width="668" height="80" rx="8" fill="#fbf9f5" stroke="#d8d0c2"/>
  <rect x="70" y="428" width="150" height="30" rx="15" fill="#ede6da"/>
  <text x="86" y="449" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="13">Malbec ×</text>
  <rect x="232" y="428" width="130" height="30" rx="15" fill="#ede6da"/>
  <text x="248" y="449" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="13">Cabernet ×</text>
  <rect x="374" y="428" width="330" height="30" rx="6" fill="#ffffff" stroke="#c9bfae"/>
  <text x="388" y="449" fill="#9a9184" font-family="Arial, sans-serif" font-size="13">Buscar y agregar cepa</text>
  <text x="70" y="482" fill="#777777" font-family="Arial, sans-serif" font-size="12">Mínimo una cepa. Se sugiere indicar porcentaje de composición.</text>

  <text x="56" y="530" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">PRESENTACIONES *</text>
  <rect x="56" y="542" width="668" height="82" rx="8" fill="#fbf9f5" stroke="#d8d0c2"/>
  <rect x="70" y="556" width="140" height="30" rx="15" fill="#ede6da"/>
  <text x="86" y="577" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="13">Botella 750 ml ×</text>
  <rect x="222" y="556" width="132" height="30" rx="15" fill="#ede6da"/>
  <text x="238" y="577" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="13">Magnum 1,5 L ×</text>
  <rect x="366" y="556" width="338" height="30" rx="6" fill="#ffffff" stroke="#c9bfae"/>
  <text x="380" y="577" fill="#9a9184" font-family="Arial, sans-serif" font-size="13">Agregar presentación</text>
  <text x="70" y="610" fill="#777777" font-family="Arial, sans-serif" font-size="12">Cada presentación tiene su propio stock y precio.</text>

  <rect x="56" y="640" width="150" height="38" rx="6" fill="#5b1f2a"/>
  <text x="87" y="664" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Guardar vino</text>
  <rect x="220" y="640" width="120" height="38" rx="6" fill="#e9e3d8" stroke="#c9bfae"/>
  <text x="248" y="664" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="15">Cancelar</text>

  <rect x="776" y="168" width="392" height="250" rx="10" fill="#ffffff" stroke="#d8d0c2"/>
  <text x="800" y="202" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="15" font-weight="bold">AYUDA</text>
  <text x="800" y="236" fill="#555555" font-family="Arial, sans-serif" font-size="14">· La añada debe ser un año válido.</text>
  <text x="800" y="264" fill="#555555" font-family="Arial, sans-serif" font-size="14">· El precio debe ser mayor a cero.</text>
  <text x="800" y="292" fill="#555555" font-family="Arial, sans-serif" font-size="14">· El stock no puede ser negativo.</text>
  <text x="800" y="320" fill="#555555" font-family="Arial, sans-serif" font-size="14">· No se repite el nombre en la bodega.</text>
  <text x="800" y="348" fill="#555555" font-family="Arial, sans-serif" font-size="14">· Las cepas se eligen del catálogo.</text>
  <text x="800" y="376" fill="#555555" font-family="Arial, sans-serif" font-size="14">· Las presentaciones son obligatorias.</text>

  <rect x="776" y="438" width="392" height="250" rx="10" fill="#fbf9f5" stroke="#d8d0c2" stroke-dasharray="6 4"/>
  <text x="800" y="472" fill="#8a8175" font-family="Arial, sans-serif" font-size="14" font-weight="bold">VISTA PREVIA</text>
  <rect x="800" y="492" width="344" height="160" rx="8" fill="#ffffff" stroke="#e2dbd0"/>
  <rect x="820" y="512" width="58" height="120" rx="4" fill="#5b1f2a"/>
  <text x="832" y="570" fill="#f2d7a6" font-family="Arial, sans-serif" font-size="11" transform="rotate(-90 832 570)">ETIQUETA</text>
  <text x="894" y="536" fill="#2b2b2b" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Malbec Reserva</text>
  <text x="894" y="562" fill="#666666" font-family="Arial, sans-serif" font-size="14">Viña del Sur · 2021</text>
  <text x="894" y="590" fill="#666666" font-family="Arial, sans-serif" font-size="14">Tinto · Malbec, Cabernet</text>
  <text x="894" y="626" fill="#5b1f2a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">$ 8.500</text>

  <text x="32" y="750" fill="#8a8175" font-family="Arial, sans-serif" font-size="13">Boceto 2 · Alta / edición de vino · TPI Bodegas del Atuel</text>
</svg>
