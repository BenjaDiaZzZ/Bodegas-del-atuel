<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Boceto de nueva venta</title>
  <desc id="descripcion">Pantalla para elegir cliente, agregar renglones, aplicar descuentos y confirmar la venta.</desc>
