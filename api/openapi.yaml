            pais_destino_principal:
              type: string
              nullable: true
              description: Solo exportadores.
              example: Brasil
            permisos:
              type: array
              description: Solo exportadores.
              items:
                $ref: '#/components/schemas/PermisoExportacion'

    ClienteCreate:
      type: object
      required:
